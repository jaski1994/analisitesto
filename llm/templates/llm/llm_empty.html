{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header">
                    <h4 class="mb-0">Analisi Testuale AI</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2 mt-3">
                            <button type="submit" class="btn btn-action">
                                <i class="fas fa-paper-plane"></i> Invia Richiesta
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            {% if result %}
            <div class="card shadow-sm border-start border-success border-4">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-success fw-bold">Risultato Elaborazione</h5>
                    <button class="btn btn-sm btn-outline-secondary"
                        onclick="navigator.clipboard.writeText('{{ result|escapejs }}')">
                        <i class="fas fa-copy"></i> Copia
                    </button>
                </div>
                <div class="card-body bg-light">
                    <div class="p-3 bg-white rounded shadow-sm"
                        style="white-space: pre-wrap; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                        {{ result }}
                    </div>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
