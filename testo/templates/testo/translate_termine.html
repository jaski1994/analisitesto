{% extends "base.html" %}
{% load static %}

{% block title %}Traduci{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary-custom text-white d-flex justify-content-between align-items-center">
          <h3 class="mb-0">Traduzione</h3>
          <button onclick="window.history.go(-1); return false;" class="btn btn-outline-light btn-sm">Indietro</button>
        </div>
        <div class="card-body">
          <div class="row align-items-center mb-3">
            <div class="col-md-5">
              <label for="lang1" class="form-label fw-bold">Lingua di partenza</label>
              <select id="lang1" class="form-select"></select>
            </div>
            <div class="col-md-2 text-center my-3 my-md-0">
              <i class="fa fa-exchange text-muted"></i>
            </div>
            <div class="col-md-5">
              <label for="lang2" class="form-label fw-bold">Lingua in cui tradurre</label>
              <select id="lang2" class="form-select"></select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <div class="p-3 bg-light rounded border h-100">
                <label class="small text-muted mb-2">Testo Originale</label>
                <textarea id="user" class="form-control border-0 bg-transparent shadow-none" rows="4"
                  readonly>{{ termine.parola }}</textarea>
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="p-3 bg-light rounded border h-100">
                <label class="small text-muted mb-2">Traduzione</label>
                <textarea id="output" class="form-control border-0 bg-transparent shadow-none fw-bold text-success"
                  rows="4" readonly></textarea>
              </div>
            </div>
          </div>

          <div class="d-grid mt-3">
            <button id="translate" class="btn btn-action btn-lg">Traduci</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const lang1 = ["it"];
    const lang1txt = ["Italiano"];
    const lang2 = ["en", "fr", "de", "zh-cn", "ko", "es", "pt", "ru", "af", "hr", "ja", "da", "nl", "ga", "pl", "sq", "mt", "no", "hi", "id", "tl", "fi", "hu", "is", "ro", "sl", "sw", "sv", "tr"];
    const lang2txt = ["Inglese", "Francese", "Tedesco", "Cinese", "Coreano", "Spagnolo", "Portoghese", "Russo", "Afrikan", "Croato", "Giapponese", "Danese", "Olandese", "Irlandese", "Polacco", "Albanese", "Maltese", "Norvegese", "Indiano", "Indonesiano", "Filippino", "Finlandese", "Ungherese", "Islandese", "Rumeno", "Sloveno", "Swahili", "Svedese", "Turco"];

    const elm = {
      lang1: document.getElementById("lang1"),
      lang2: document.getElementById("lang2"),
      user: document.getElementById("user"),
      output: document.getElementById("output"),
      translateBtn: document.getElementById("translate")
    };

    // Populate selects
    lang1.forEach((l, i) => {
      let option = document.createElement("option");
      option.value = l;
      option.text = lang1txt[i];
      elm.lang1.appendChild(option);
    });

    lang2.forEach((l, i) => {
      let option = document.createElement("option");
      option.value = l;
      option.text = lang2txt[i];
      elm.lang2.appendChild(option);
    });

    elm.translateBtn.addEventListener("click", function () {
      const text = elm.user.value.replace(/ /g, '%20');
      fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${elm.lang1.value}&tl=${elm.lang2.value}&dt=t&q=${text}`)
        .then(response => response.json())
        .then(json => {
          elm.output.value = json[0][0][0];
        })
        .catch(error => {
          console.error('Error:', error);
          elm.output.value = "Errore durante la traduzione.";
        });
    });
  });
</script>
{% endblock %}
