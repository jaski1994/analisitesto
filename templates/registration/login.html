{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="text-center mb-4">
        <h1 class="display-4 fw-bold text-primary-custom">Analizza il vocabolario</h1>
        <h2 class="h4 text-muted">Accedi al tuo account</h2>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-action btn-lg">Login</button>
                        </div>
                        <div class="text-center mt-3">
                            <span class="text-muted">Non hai un account?</span>
                            <a href="{% url 'testo:register' %}"
                                class="btn btn-outline-action btn-sm ms-2">Registrati</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
